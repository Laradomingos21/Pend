<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <div class="container">
        <h2>Cadastro de Usuário</h2> 

        <form action="#">
            <label>Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
            <p id="nome2"></p>

            <label>Email</label>
            <input type="text" id="email" placeholder="Digite seu email">
            <p id="email2"></p>

            <label>Senha</label>
            <div class="senha">
                <input type="password" id="senha" placeholder="Digite sua senha">
                <i class="bi-eye-slash-fill icone" id="botaoSenha"></i>
            </div>
            <p id="senha2"></p>

            <label>Telefone</label>
            <input type="text" id="telefone" placeholder="Digite seu telefone"><br>
            <p id="telefone2"></p>
            <button id="novotelefone">Adicionar outro Telefone:</button><br>
            
            <button type="button" id="cadastrar">Cadastrar</button>
            <p id="mensagem"></p>
        </form>


    </div>

    <footer>
        <p>email: techconnect@mail.com</p>
        <p>Instagram: techconnect_7</p>
        <small>&copy; 2026 TechConnect - Todos os direitos reservados</small>
    </footer>

    <script src="cadastro.js"></script>
</body>

</html>
